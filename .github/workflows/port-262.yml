name: Port to Minecraft 26.2
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  port:
    if: "!contains(github.event.head_commit.message, '[26.2-port]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Save target build files
        run: |
          mkdir -p /tmp/target
          cp gradle.properties /tmp/target/gradle.properties
          cp build.gradle /tmp/target/build.gradle
          cp settings.gradle /tmp/target/settings.gradle
          find src -name fabric.mod.json -print0 | while IFS= read -r -d '' f; do mkdir -p "/tmp/target/$(dirname "$f")"; cp "$f" "/tmp/target/$f"; done
      - name: Prepare temporary 1.21.11 Yarn build
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('gradle.properties')
          s = p.read_text()
          s = re.sub(r'^minecraft_version=.*$', 'minecraft_version=1.21.11', s, flags=re.M)
          s = re.sub(r'^loader_version=.*$', 'loader_version=0.19.3', s, flags=re.M)
          s = re.sub(r'^loom_version=.*$', 'loom_version=1.17.13', s, flags=re.M)
          s = re.sub(r'^(fabric_api_version|fabric_version)=.*$', lambda m: m.group(1) + '=0.141.6+1.21.11', s, flags=re.M)
          if 'yarn_mappings=' not in s:
              s += '\nyarn_mappings=1.21.11+build.4\n'
          elif re.search(r'^yarn_mappings=.*$', s, flags=re.M):
              s = re.sub(r'^yarn_mappings=.*$', 'yarn_mappings=1.21.11+build.4', s, flags=re.M)
          p.write_text(s)
          p = Path('build.gradle')
          s = p.read_text()
          s = s.replace("net.fabricmc.fabric-loom'", "net.fabricmc.fabric-loom-remap'")
          s = s.replace("net.fabricmc.fabric-loom\"", "net.fabricmc.fabric-loom-remap\"")
          if 'mappings ' not in s:
              s = s.replace('    minecraft "com.mojang:minecraft:${project.minecraft_version}"\n', '    minecraft "com.mojang:minecraft:${project.minecraft_version}"\n    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"\n')
              s = s.replace('    minecraft "com.mojang:minecraft:${minecraft_version}"\n', '    minecraft "com.mojang:minecraft:${minecraft_version}"\n    mappings "net.fabricmc:yarn:${yarn_mappings}:v2"\n')
          s = s.replace('implementation "net.fabricmc:fabric-loader:', 'modImplementation "net.fabricmc:fabric-loader:')
          s = s.replace('implementation "net.fabricmc.fabric-api:fabric-api:', 'modImplementation "net.fabricmc.fabric-api:fabric-api:')
          s = s.replace('options.release = 25', 'options.release = 21')
          s = s.replace('JavaVersion.VERSION_25', 'JavaVersion.VERSION_21')
          p.write_text(s)
          p = Path('settings.gradle')
          s = p.read_text()
          s = s.replace('version \"1.17.21\"', 'version \"1.17.13\"')
          p.write_text(s)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Migrate Yarn to Mojang mappings
        run: gradle migrateMappings --input "src/main/java" --output "remappedSrc" --mappings "net.minecraft:mappings:1.21.11" --no-daemon && test -d remappedSrc
      - name: Restore 26.2 build files
        run: |
          cp /tmp/target/gradle.properties gradle.properties
          cp /tmp/target/build.gradle build.gradle
          cp /tmp/target/settings.gradle settings.gradle
      - name: Install migrated source
        run: |
          rm -rf src/main/java
          mkdir -p src/main/java
          cp -R remappedSrc/. src/main/java/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Fix 26.2 API compatibility
        shell: python
        run: |
          from pathlib import Path

          for path in Path("src").rglob("*.java"):
              s = path.read_text(encoding="utf-8")

              # Fabric API 26.2 renames.
              s = s.replace("net.fabricmc.fabric.api.client.command.v2.ClientCommandManager",
                            "net.fabricmc.fabric.api.client.command.v2.ClientCommands")
              s = s.replace("ClientCommandManager.", "ClientCommands.")

              # Common vanilla Mojang mapping names which migrateMappings can leave
              # behind when the old Yarn symbol had no direct 1:1 migration.
              s = s.replace("net.minecraft.text.MutableText", "net.minecraft.network.chat.MutableComponent")
              s = s.replace("net.minecraft.text.Text", "net.minecraft.network.chat.Component")
              s = s.replace("Text.literal", "Component.literal")
              s = s.replace("Text.empty", "Component.empty")
              s = s.replace("net.minecraft.util.Formatting", "net.minecraft.ChatFormatting")
              s = s.replace("Formatting.", "ChatFormatting.")
              s = s.replace(".formatted(", ".withStyle(")

              # 26.2 GUI reorganisation.
              s = s.replace("client.currentScreen", "client.gui.screen()")
              s = s.replace("client.screen", "client.gui.screen()")
              s = s.replace("client.setScreen(", "client.gui.setScreen(")
              s = s.replace("client.isWindowFocused()", "client.isWindowActive()")
              s = s.replace("client.getMainRenderTarget()", "client.gameRenderer.mainRenderTarget()")

              

              # HUD callback was removed; register a HUD element instead.
              s = s.replace("import net.fabricmc.fabric.api.client.rendering.v1.HudRenderCallback;",
                            "import net.fabricmc.fabric.api.client.rendering.v1.hud.HudElementRegistry;")
              s = s.replace(
                  "HudRenderCallback.EVENT.register((drawContext, tickCounter) -> reactiveController.onRenderFrame());",
                  "HudElementRegistry.addLast(net.minecraft.resources.Identifier.fromNamespaceAndPath(MOD_ID, \"reactive\"), (graphics, deltaTracker) -> reactiveController.onRenderFrame());"
              )
              

              

              path.write_text(s, encoding="utf-8")

      - name: Build 26.2
        run: |
          rm -rf build
          gradle clean build --no-daemon --max-workers=1
      - name: Commit migrated port
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "[26.2-port] Migrate source to Minecraft 26.2" || exit 0
          git push